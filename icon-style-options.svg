  <linearGradient id="classicEdge" x2="0" y2="1"><stop stop-color="#a9b2b0"/><stop offset="1" stop-color="#59615f"/></linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
  <symbol id="previous" viewBox="0 0 64 64"><path d="M48 12 18 32l30 20z"/><path d="M11 13v38" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></symbol>
