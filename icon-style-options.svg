 <text x="48" y="167" fill="#8e9b96" font-family="Segoe UI,Arial,sans-serif" font-size="14">Beveled metal buttons, solid symbols, strong contrast</text>
 <g color="#89eb9d" fill="currentColor" filter="url(#softShadow)">
  <g transform="translate(77 185)"><rect width="94" height="92" rx="2" fill="url(#classicFace)" stroke="url(#classicEdge)" stroke-width="2"/><path d="M3 4h88" stroke="#bac2c0" opacity=".32"/><svg x="18" y="15" width="58" height="58" viewBox="0 0 64 64"><use href="#previous"/></svg><text x="47" y="117" text-anchor="middle" fill="#c0c9c5" font-family="Segoe UI,Arial,sans-serif" font-size="14">Previous</text></g>
