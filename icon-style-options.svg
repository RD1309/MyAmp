  <g transform="translate(725 677)"><rect width="94" height="92" rx="18" fill="#18201d" stroke="#315640" stroke-width="1.5"/><svg x="18" y="15" width="58" height="58" viewBox="0 0 64 64"><use href="#stop" fill="none" stroke="currentColor"/></svg><text x="47" y="117" text-anchor="middle" fill="#c0c9c5" stroke="none" font-family="Segoe UI,Arial,sans-serif" font-size="14">Stop</text></g>
