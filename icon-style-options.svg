 <rect width="1450" height="880" fill="#15191b"/>
 <text x="38" y="53" fill="#89eb9d" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">MyAmp · Control icon directions</text>
 <text x="40" y="83" fill="#aeb8b4" font-family="Segoe UI,Arial,sans-serif" font-size="17">Same recognizable transport actions, three treatments. Green matches the player accent.</text>

 <!-- Classic -->
