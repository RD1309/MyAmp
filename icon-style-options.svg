  <g transform="translate(1211 431)"><rect width="94" height="92" rx="7" fill="#2a3032" stroke="#64706c"/><svg x="18" y="15" width="58" height="58" viewBox="0 0 64 64"><use href="#repeatAll"/></svg><text x="47" y="117" text-anchor="middle" fill="#c0c9c5" font-family="Segoe UI,Arial,sans-serif" font-size="14">Repeat list</text></g>
 </g>

 <!-- Modern -->
